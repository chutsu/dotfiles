# Prefix
set-option -g prefix C-b

# Behaviour
set -g mouse on
set -as terminal-features ',xterm*:RGB'
set-option -g history-limit 100000
set-option -g automatic-rename-format ""

# Status bar settings
set -g base-index 0
set-option -g renumber-windows on
set -g status-bg colour238
set -g status-fg white
set -g status-left " "
set -g status-left-length 40
set -g status-right-length 80
set -g status-interval 5
set -g status-right "#(python3 ~/dotfiles/scripts/tmux_status)"

# Window settings
bind c new-window
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}:#{pane_current_command}"
set -g window-style "fg=color250,bg=colour236"
set -g window-active-style "fg=color255,bg=colour234"
set -g window-status-style fg="#FFFFFF",bg="#555555"
set -g window-status-format " [#I] #W "
set -g window-status-current-style fg="#000000",bg="#E11584"
set -g window-status-current-format " [#I] #W "

# Pane border
set -g pane-border-style "fg=white,bg=default"
set -g pane-active-border-style "fg=#E11584,bg=default"

# Pane settings
bind '%' split-window -h -c '#{pane_current_path}'  # split panes horizontal
bind '"' split-window -v -c '#{pane_current_path}'  # split panes vertically
bind c new-window -c '#{pane_current_path}'  # create new window

# Select pane shortcut keys
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Copy-paste
set -g set-clipboard on
setw -g mode-keys vi
set -g allow-passthrough on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "cat"

# Last window
bind-key C-b last-window
